name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -q
      - run: python -m unittest discover -s examples/refund-regression -v
      - run: python examples/refund-regression/demo.py
      - run: node --check virtual_trade_lab/web/app.js
      - run: python -m virtual_trade_lab --scenario all --json > /tmp/demo.json
      - run: python -m virtual_trade_lab.products --output /tmp/product-bundle
      - run: python -m virtual_trade_lab.realism --output /tmp/realism.json
      - run: python -m virtual_trade_lab.calibration_protocol
      - run: python -m unittest discover -s examples/short-drama-benchmark -p 'test_*.py' -v
      - run: python -O -m unittest discover -s examples/short-drama-benchmark -p 'test_*.py' -q
      - run: node --check virtual_trade_lab/web/replay.js
      - run: node tests/replay_interaction_test.js
      - run: python -m virtual_trade_lab.replay_data --study examples/defect-refund-model-study --output /tmp/replay-data.json && cmp /tmp/replay-data.json virtual_trade_lab/web/replay-data.json
